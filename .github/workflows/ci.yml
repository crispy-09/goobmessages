name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          brew install protobuf swift-protobuf
          pip install grpcio-tools pillow
      - name: Generate protobuf + schema
        run: ./generate.sh
      - name: Verify generated schema is committed & current
        run: git diff --exit-code Sources/GMessagesMac/Generated/PBLiteSchema.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test
