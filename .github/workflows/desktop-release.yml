name: Desktop release (Linux & Windows)

# Push a tag like desktop-v0.2.0 (or run this workflow by hand with a version) to build the Linux and Windows apps
# and publish them as a GitHub release. Desktop tags are separate from the Mac app's v* tags, and desktop
# releases are not marked "Latest" so the Mac release keeps that spot.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the prefix (e.g. 0.2.0). Creates the tag desktop-v<version>."
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: desktop
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        working-directory: .
        env:
          INPUT: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT" ]; then v="$INPUT"; else v="${REF#desktop-v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$v' is not like 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            tags: "-tags webkit2_41"
          - os: windows-latest
            platform: windows
            tags: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: desktop/go.mod, cache-dependency-path: desktop/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/frontend/package-lock.json }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: NSIS
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null; then choco install nsis -y --no-progress; fi
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Tests
        run: |
          (cd frontend && npm ci && npm test)
          go test ${{ matrix.tags }} ./...
      - name: Stamp version
        run: node -e 'const f="wails.json",j=require("./"+f);j.info.productVersion=process.env.VERSION.split("-")[0];require("fs").writeFileSync(f,JSON.stringify(j,null,2)+"\n")'

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          wails build -tags webkit2_41 -trimpath -clean -ldflags "-s -w -X main.appVersion=$VERSION"
          name="goobmessages-$VERSION-linux-amd64"
          mkdir -p "dist/$name"
          cp build/bin/goobmessages "dist/$name/"
          cp build/linux/goobmessages.desktop "dist/$name/"
          cp build/appicon.png "dist/$name/goobmessages.png"
          cp scripts/install-prebuilt-linux.sh "dist/$name/install.sh"
          cp README.md "dist/$name/README.md"
          cp ../LICENSE "dist/$name/LICENSE" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          mkdir -p out && mv "dist/$name.tar.gz" out/

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          wails build -trimpath -clean -nsis -ldflags "-s -w -X main.appVersion=$VERSION"
          mkdir -p out
          cp build/bin/goobmessages.exe "out/goobmessages-$VERSION-windows-amd64-portable.exe"
          installer=$(ls build/bin/*installer*.exe | head -1)
          cp "$installer" "out/goobmessages-$VERSION-windows-amd64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: desktop/out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true, pattern: release-* }
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        working-directory: .
        run: |
          cat > notes.md <<EOF
          Goob Messages for **Linux and Windows** $VERSION, a Google Messages (SMS/RCS) client for your Android phone.

          **Linux** (x86-64): download \`goobmessages-$VERSION-linux-amd64.tar.gz\`, extract it and run \`./install.sh\`.
          Needs WebKitGTK 4.1 (Arch: \`webkit2gtk-4.1\`, Debian/Ubuntu: \`libwebkit2gtk-4.1-0\`, Fedora: \`webkit2gtk4.1\`).

          **Windows 10/11** (x64): run \`goobmessages-$VERSION-windows-amd64-setup.exe\`, or use the \`-portable.exe\`.
          The builds aren't code-signed, so SmartScreen may warn on first launch ("More info" → "Run anyway").

          Sign in with the Google account Google Messages uses on your phone, then tap the emoji shown in the app.
          Unofficial, and uses an undocumented Google API. See \`desktop/README.md\`. Checksums are in \`SHA256SUMS.txt\`.
          EOF
      - name: Publish
        working-directory: .
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "Goob Messages for Linux & Windows $VERSION" \
              --notes-file notes.md --latest=false $([[ "$VERSION" == *-* ]] && echo --prerelease)
          fi
