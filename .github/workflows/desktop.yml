name: Desktop (Linux & Windows)
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: desktop
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: goobmessages-linux-amd64
            tags: "-tags webkit2_41"
          - os: windows-latest
            artifact: goobmessages-windows-amd64
            tags: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: desktop/go.mod, cache-dependency-path: desktop/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/frontend/package-lock.json }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Frontend tests
        working-directory: desktop/frontend
        run: npm ci && npm test
      - name: Go tests
        run: go test ${{ matrix.tags }} ./...
      - name: Build
        run: wails build ${{ matrix.tags }} -trimpath -clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/build/bin/
