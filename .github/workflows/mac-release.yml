name: Mac release

# Push a tag like v1.2.0 (or run this workflow by hand with a version) to build the universal Mac app and publish it as
# a GitHub release with GoobMessage.dmg, GoobMessage.zip and SHA256SUMS.txt. Stable Mac releases are marked "Latest"
# (scripts/install.sh relies on that); versions with a suffix like 1.3.0-beta.1 become pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.2.0). Creates the tag v<version>."
        required: true

permissions:
  contents: read

concurrency:
  group: mac-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT" ]; then v="$INPUT"; else v="${REF#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$v' is not like 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          brew install protobuf swift-protobuf
          pip install grpcio-tools pillow
      - name: Generate protobuf + schema
        run: ./generate.sh
      - name: Test
        run: swift test
      - name: Build app + disk image
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./scripts/make_app.sh
          ./scripts/make_dmg.sh
          test "$(defaults read "$PWD/build/Goob Message.app/Contents/Info.plist" CFBundleShortVersionString)" = "$VERSION"
          lipo -archs "build/Goob Message.app/Contents/MacOS/GMessagesMac"
          mkdir -p out
          cp build/GoobMessage.dmg out/
          ditto -c -k --keepParent "build/Goob Message.app" out/GoobMessage.zip
          (cd out && shasum -a 256 GoobMessage.dmg GoobMessage.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mac-release, path: assets }
      - name: Release notes
        run: |
          # This version's section of CHANGELOG.md, if there is one.
          awk -v v="## $VERSION" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > changes.md
          {
            echo "Goob Message for **Mac** $VERSION (macOS 13+, Apple Silicon and Intel)."
            echo
            echo "**Install or update:** run this in Terminal (it downloads this release, checks its checksum and replaces the app):"
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | bash"
            echo '```'
            echo
            echo "Or download \`GoobMessage.dmg\` and drag the app to Applications. The app isn't notarized, so the first"
            echo "time macOS will block it: open **System Settings → Privacy & Security** and click **Open Anyway**."
            echo
            if [ -s changes.md ]; then echo "### Changes"; cat changes.md; echo; fi
            echo "Checksums are in \`SHA256SUMS.txt\`. Linux and Windows builds are the \`desktop-v*\` releases."
          } > notes.md
          cat notes.md
      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          elif [[ "$VERSION" == *-* ]]; then
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "Goob Message for Mac $VERSION" \
              --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "Goob Message for Mac $VERSION" \
              --notes-file notes.md --latest
          fi
